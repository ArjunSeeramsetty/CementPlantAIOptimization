# Zerve AI Agent Prompts and Templates
# Pre-configured prompts for common cement plant optimization tasks

agent_prompts:
  
  # ==================== DATA ENGINEERING ====================
  
  data_pipeline_etl:
    agent_type: "data_pipeline"
    description: "Build ETL pipeline for cement plant data"
    prompt: |
      Create a robust ETL pipeline to:
      1. Extract sensor data from BigQuery table: {source_table}
      2. Apply data quality checks (null values, outliers, range validation)
      3. Transform data with:
         - Timestamp alignment to 15-minute intervals
         - Feature engineering (rolling averages, trends)
         - Unit conversions where needed
      4. Load processed data to: {destination_table}
      5. Generate data quality report
      
      Use parallel processing for large datasets and include error handling.
    variables:
      - source_table: "cement_plant_data.raw_sensor_data"
      - destination_table: "cement_plant_data.processed_sensor_data"
    compute_profile: "standard"
  
  data_validation:
    agent_type: "analysis"
    description: "Validate data quality and detect anomalies"
    prompt: |
      Perform comprehensive data validation on {data_source}:
      1. Check data completeness (missing values, gaps in time series)
      2. Detect statistical anomalies using:
         - Z-score method (threshold: 3σ)
         - IQR method for robust outlier detection
         - Time-series decomposition for trend anomalies
      3. Validate against operational constraints:
         - Temperature: 1200-1500°C
         - Pressure: 0-5 bar
         - Feed rate: 50-200 tons/hour
      4. Generate validation report with:
         - Data quality score
         - Anomaly locations
         - Recommendations for correction
    variables:
      - data_source: "cement_plant_data.realtime_sensor_data"
    compute_profile: "lightweight"
  
  # ==================== MACHINE LEARNING ====================
  
  quality_prediction_model:
    agent_type: "ml_training"
    description: "Train clinker quality prediction model"
    prompt: |
      Develop a clinker quality prediction model:
      
      Data Preparation:
      1. Load historical quality data from {training_data}
      2. Engineer features:
         - Raw material composition (limestone, clay, iron ore)
         - Process parameters (kiln temp, rotation speed, feed rate)
         - Time-based features (hour of day, day of week)
         - Rolling statistics (24h mean temp, 12h std vibration)
      
      Model Training:
      3. Try multiple algorithms:
         - Random Forest (baseline)
         - XGBoost (for non-linear relationships)
         - Neural Network (for complex patterns)
         - PINN (Physics-Informed for domain knowledge)
      4. Use 5-fold cross-validation
      5. Optimize for {target_metric}
      
      Evaluation:
      6. Calculate metrics: R², MAE, RMSE
      7. Feature importance analysis
      8. Residual analysis
      9. Save best model with metadata
      
      Target: Clinker quality (C3S, C2S, C3A, C4AF percentages)
    variables:
      - training_data: "cement_plant_data.quality_training_data"
      - target_metric: "r2_score"
    compute_profile: "gpu_training"
  
  predictive_maintenance:
    agent_type: "ml_training"
    description: "Build predictive maintenance model"
    prompt: |
      Create a predictive maintenance model for equipment failure prediction:
      
      1. Data Collection:
         - Sensor readings: temperature, vibration, pressure, current
         - Maintenance history: failure types, repair times
         - Operational context: load, runtime hours, environment
      
      2. Feature Engineering:
         - Time since last maintenance
         - Cumulative operating hours
         - Degradation indicators (trend of vibration increase)
         - Interaction features (temp × vibration)
      
      3. Model Development:
         - Binary classification: failure within next 7 days (yes/no)
         - Multi-class classification: failure type prediction
         - Regression: days until failure
         - Use class imbalance handling (SMOTE, class weights)
      
      4. Evaluation:
         - Optimize for recall (catch all failures)
         - Acceptable precision (minimize false alarms)
         - Early warning time (predict 7 days ahead)
      
      5. Deployment:
         - Real-time scoring on current sensor data
         - Alert generation for high-risk equipment
         - Integration with maintenance scheduling system
    variables:
      - lookback_days: 90
      - prediction_horizon: 7
    compute_profile: "gpu_training"
  
  anomaly_detection:
    agent_type: "ml_training"
    description: "Train anomaly detection model"
    prompt: |
      Build an unsupervised anomaly detection system:
      
      1. Normal Behavior Learning:
         - Use last {normal_period_days} days of operation
         - Multiple algorithms:
           * Isolation Forest (for global anomalies)
           * Local Outlier Factor (for local anomalies)
           * Autoencoder (for complex patterns)
      
      2. Real-time Detection:
         - Score incoming sensor data
         - Ensemble voting from multiple models
         - Confidence scores for each anomaly
      
      3. Root Cause Analysis:
         - Identify which sensors are anomalous
         - Temporal pattern analysis
         - Correlation with process changes
      
      4. Alert System:
         - Severity levels (low, medium, high, critical)
         - Automated notifications
         - Recommended actions
    variables:
      - normal_period_days: 30
      - contamination: 0.01
    compute_profile: "standard"
  
  # ==================== OPTIMIZATION ====================
  
  energy_optimization:
    agent_type: "optimization"
    description: "Optimize energy consumption"
    prompt: |
      Multi-objective energy optimization for cement plant:
      
      Objective Function:
      - Minimize: Total energy consumption (kWh/ton clinker)
      - Maximize: Production throughput (tons/hour)
      - Maintain: Clinker quality ≥ {min_quality}%
      
      Decision Variables:
      - Kiln temperature (°C)
      - Raw mill feed rate (tons/hour)
      - Cooler fan speed (RPM)
      - Coal feeding rate (kg/hour)
      
      Constraints:
      1. Safety:
         - Temperature: 1200 ≤ T ≤ 1500°C
         - Pressure: P ≤ 5 bar
      2. Quality:
         - C3S content: 50-65%
         - Clinker fineness: 3000-3500 cm²/g
      3. Operational:
         - Kiln load: 75-95%
         - Stable operation (low variability)
      
      Optimization Method:
      - Use Particle Swarm Optimization (PSO) or Genetic Algorithm (GA)
      - Multi-start for global optimum
      - Real-time validation against current plant state
      
      Output:
      - Optimal parameter settings
      - Expected energy savings (kWh and %)
      - Expected production impact
      - Implementation recommendations
    variables:
      - min_quality: 95
      - optimization_horizon_hours: 4
    compute_profile: "standard"
  
  process_optimization:
    agent_type: "optimization"
    description: "Optimize overall process parameters"
    prompt: |
      Holistic process optimization for cement production:
      
      Optimize across entire production chain:
      1. Raw Material Preparation
         - Raw mix proportions
         - Grinding fineness
      
      2. Pyro-processing (Kiln)
         - Kiln temperature profile
         - Retention time
         - Oxygen levels
      
      3. Clinker Cooling
         - Cooling rate
         - Air flow distribution
      
      4. Finish Grinding
         - Mill load
         - Separator efficiency
      
      Objectives:
      - Minimize specific energy consumption
      - Maximize clinker quality
      - Minimize CO2 emissions
      - Minimize operating costs
      
      Use historical data to build surrogate models for each process stage,
      then optimize the full chain with cascade constraints.
    variables:
      - optimization_method: "sequential_quadratic_programming"
    compute_profile: "standard"
  
  emissions_reduction:
    agent_type: "optimization"
    description: "Optimize for emissions reduction"
    prompt: |
      CO2 emissions reduction optimization:
      
      Target: Reduce CO2 emissions while maintaining production and quality
      
      Levers:
      1. Alternative Fuels:
         - Increase waste-derived fuel percentage
         - Optimize fuel mix for lowest carbon intensity
      
      2. Raw Material Substitution:
         - Increase clinker substitutes (fly ash, slag)
         - Optimize cement composition
      
      3. Process Efficiency:
         - Reduce thermal energy consumption
         - Improve combustion efficiency
      
      4. Operational Parameters:
         - Optimize kiln operation for fuel efficiency
         - Minimize excess oxygen
      
      Constraints:
      - Clinker quality must meet standards
      - Production volume ≥ {min_production}
      - Alternative fuel availability
      - Regulatory compliance
      
      Output:
      - Emissions reduction plan
      - Cost-benefit analysis
      - Implementation timeline
      - Expected CO2 savings (tons/year)
    variables:
      - min_production: 1000
      - target_reduction_percent: 20
    compute_profile: "standard"
  
  # ==================== ANALYSIS & INSIGHTS ====================
  
  root_cause_analysis:
    agent_type: "analysis"
    description: "Perform root cause analysis for issues"
    prompt: |
      Investigate root cause of {issue_description}:
      
      Analysis Steps:
      1. Timeline Analysis:
         - When did the issue start?
         - What changed before the issue?
         - Pattern of occurrence
      
      2. Correlation Analysis:
         - Which sensors/parameters correlate with the issue?
         - Time-lagged correlations
         - Granger causality tests
      
      3. Comparative Analysis:
         - Compare to normal operation periods
         - Statistical significance testing
         - Distribution shifts
      
      4. Process Physics:
         - First principles analysis
         - Material and energy balances
         - Thermodynamic constraints
      
      5. Historical Context:
         - Has this happened before?
         - What was the resolution?
         - Lessons learned
      
      Output:
      - Primary root cause (with confidence level)
      - Contributing factors
      - Evidence supporting analysis
      - Recommended corrective actions
      - Preventive measures
    variables:
      - issue_description: "Quality drop in clinker production"
      - analysis_window_hours: 72
    compute_profile: "standard"
  
  performance_benchmarking:
    agent_type: "analysis"
    description: "Benchmark plant performance"
    prompt: |
      Comprehensive performance benchmarking:
      
      Compare current plant performance against:
      1. Historical Best Performance:
         - Last 12 months best periods
         - Key metrics: energy, quality, throughput
      
      2. Industry Standards:
         - BAT (Best Available Technology) benchmarks
         - Regional average performance
      
      3. Theoretical Optimal:
         - Thermodynamic limits
         - Equipment design capacity
      
      Metrics to Benchmark:
      - Specific energy consumption (kWh/ton)
      - Clinker quality consistency
      - Production throughput
      - Equipment availability (OEE)
      - Emissions intensity
      - Operating costs
      
      Analysis:
      - Gap analysis (current vs. target)
      - Improvement opportunities
      - Quick wins vs. long-term projects
      - ROI estimation for improvements
      
      Output:
      - Performance dashboard
      - Gap analysis report
      - Prioritized improvement roadmap
    variables:
      - benchmark_period: "last_90_days"
    compute_profile: "standard"
  
  # ==================== REAL-TIME OPERATIONS ====================
  
  realtime_monitoring:
    agent_type: "data_pipeline"
    description: "Real-time monitoring and alerting"
    prompt: |
      Set up real-time monitoring system:
      
      1. Data Ingestion:
         - Stream sensor data (15-second intervals)
         - Process in near real-time
         - Buffer for network issues
      
      2. Monitoring Rules:
         - Threshold alerts (temp > 1500°C)
         - Rate-of-change alerts (rapid pressure increase)
         - Pattern alerts (oscillating behavior)
         - Predictive alerts (heading towards failure)
      
      3. Alert Management:
         - Severity classification
         - De-duplication (avoid alert storms)
         - Smart routing (right person, right time)
         - Escalation rules
      
      4. Dashboard Updates:
         - Live metrics visualization
         - KPI tracking
         - Trend analysis
         - Alert history
      
      5. Data Storage:
         - High-frequency data: 30-day retention
         - Aggregated data: permanent storage
         - Alert logs: permanent with annotations
    variables:
      - update_interval_seconds: 15
      - alert_channels: ["email", "sms", "slack"]
    compute_profile: "standard"
  
  control_recommendations:
    agent_type: "optimization"
    description: "Generate real-time control recommendations"
    prompt: |
      Generate real-time operational recommendations:
      
      Every {recommendation_interval} minutes:
      1. Assess Current State:
         - All sensor readings
         - Recent trends
         - Current product quality
         - Equipment health
      
      2. Predict Near Future:
         - Next 1 hour projections
         - Identify potential issues
      
      3. Generate Recommendations:
         - Parameter adjustments for optimal operation
         - Preventive actions for predicted issues
         - Opportunistic optimization
      
      4. Validate Recommendations:
         - Safety check
         - Feasibility check
         - Impact assessment
      
      5. Present to Operators:
         - Clear, actionable recommendations
         - Expected impact
         - Confidence level
         - Implementation instructions
      
      Recommendations should be:
      - Safe (validated against all constraints)
      - Practical (implementable by operators)
      - Beneficial (clear value proposition)
      - Timely (relevant to current situation)
    variables:
      - recommendation_interval: 15
      - lookahead_minutes: 60
    compute_profile: "standard"
  
  # ==================== REPORTING & VISUALIZATION ====================
  
  automated_reporting:
    agent_type: "analysis"
    description: "Generate automated reports"
    prompt: |
      Create {report_type} report:
      
      Data Collection:
      - Query data for period: {report_period}
      - Aggregate to appropriate granularity
      - Calculate KPIs and metrics
      
      Report Sections:
      1. Executive Summary:
         - Key metrics vs. targets
         - Major achievements
         - Critical issues
      
      2. Production Performance:
         - Volume and throughput
         - Quality metrics
         - Downtime analysis
      
      3. Energy Performance:
         - Consumption by process area
         - Specific energy consumption
         - Trends and comparisons
      
      4. Quality Analysis:
         - Quality metrics distribution
         - Out-of-spec incidents
         - Quality improvements
      
      5. Maintenance:
         - Equipment health
         - Preventive maintenance completion
         - Unplanned downtime
      
      6. Recommendations:
         - Areas for improvement
         - Action items
         - Expected benefits
      
      Output Format: PDF report with executive summary, detailed analysis,
      charts, and appendices with supporting data.
    variables:
      - report_type: "daily"  # daily, weekly, monthly
      - report_period: "last_24_hours"
    compute_profile: "lightweight"
  
  dashboard_builder:
    agent_type: "data_pipeline"
    description: "Build interactive dashboard"
    prompt: |
      Create interactive dashboard for {dashboard_purpose}:
      
      Dashboard Components:
      1. Real-time Metrics:
         - Current sensor values
         - Production rate
         - Quality indicators
         - Equipment status
      
      2. Trend Charts:
         - Time series of key parameters
         - Customizable time ranges
         - Zoom and pan capabilities
      
      3. Comparison Views:
         - Current vs. target
         - Current vs. historical average
         - Shift-over-shift comparison
      
      4. Analytics:
         - Statistical summaries
         - Distribution charts
         - Correlation matrices
      
      5. Alerts Panel:
         - Active alerts
         - Alert history
         - Acknowledgment tracking
      
      Technology Stack:
      - Backend: FastAPI with async endpoints
      - Frontend: Plotly Dash or Streamlit
      - Database: BigQuery for data
      - Refresh: Every {refresh_seconds} seconds
      
      Make it mobile-responsive for tablet viewing.
    variables:
      - dashboard_purpose: "operations_control_room"
      - refresh_seconds: 30
    compute_profile: "lightweight"

# Agent personalities and behaviors
agent_behaviors:
  
  conservative:
    description: "Risk-averse approach, prioritizes safety and stability"
    characteristics:
      - Always validates against safety constraints
      - Prefers incremental changes
      - Emphasizes testing before implementation
      - Thorough documentation
  
  aggressive:
    description: "Performance-focused, willing to take calculated risks"
    characteristics:
      - Pushes optimization boundaries
      - Larger parameter changes for faster results
      - Balances risk vs. reward
      - Requires monitoring during implementation
  
  balanced:
    description: "Middle ground between conservative and aggressive"
    characteristics:
      - Moderate changes with safety margins
      - Considers both short-term and long-term impacts
      - Adapts based on confidence in predictions
      - Good default for most situations

# Multi-agent collaboration templates
collaboration_patterns:
  
  sequential:
    description: "Agents work one after another"
    example:
      - agent: "analyzer"
        task: "Analyze current state"
      - agent: "optimizer"
        task: "Optimize based on analysis"
        depends_on: ["analyzer"]
      - agent: "validator"
        task: "Validate recommendations"
        depends_on: ["optimizer"]
  
  parallel:
    description: "Agents work simultaneously on different aspects"
    example:
      - agent: "energy_analyst"
        task: "Analyze energy consumption"
      - agent: "quality_analyst"
        task: "Analyze quality trends"
      - agent: "maintenance_analyst"
        task: "Analyze equipment health"
      - agent: "aggregator"
        task: "Combine all analyses"
        depends_on: ["energy_analyst", "quality_analyst", "maintenance_analyst"]
  
  iterative:
    description: "Agents refine each other's work through iterations"
    example:
      - agent: "proposer"
        task: "Propose optimization strategy"
      - agent: "critic"
        task: "Identify issues with proposal"
        depends_on: ["proposer"]
      - agent: "refiner"
        task: "Refine based on criticism"
        depends_on: ["critic"]
      - loop: true
        max_iterations: 3

